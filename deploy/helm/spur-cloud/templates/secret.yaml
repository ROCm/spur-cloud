{{- if .Values.secrets.create -}}
{{- if not .Values.secrets.jwtSecret -}}
{{- fail "secrets.jwtSecret is required (generate with: openssl rand -hex 32) — or set secrets.existingSecret and secrets.create=false" -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "spur-cloud.secretName" . }}
  labels:
    {{- include "spur-cloud.labels" . | nindent 4 }}
type: Opaque
stringData:
  spur-cloud.toml: |
    public_url = {{ .Values.config.publicUrl | quote }}

    [server]
    listen_addr = {{ .Values.config.server.listenAddr | quote }}
    session_namespace = {{ .Values.sessionNamespace | quote }}

    [database]
    url = {{ include "spur-cloud.databaseUrl" . | quote }}

    [spur]
    controller_addr = {{ .Values.config.spur.controllerAddr | quote }}

    [auth]
    jwt_secret = {{ .Values.secrets.jwtSecret | quote }}
    jwt_expiry_hours = {{ .Values.config.auth.jwtExpiryHours }}
    {{- if .Values.config.auth.github.enabled }}
    {{- if not .Values.secrets.githubClientSecret }}
    {{- fail "secrets.githubClientSecret is required when config.auth.github.enabled" }}
    {{- end }}

    [auth.github]
    enabled = true
    client_id = {{ .Values.config.auth.github.clientId | quote }}
    client_secret = {{ .Values.secrets.githubClientSecret | quote }}
    {{- end }}
    {{- if .Values.config.auth.okta.enabled }}
    {{- if not .Values.secrets.oktaClientSecret }}
    {{- fail "secrets.oktaClientSecret is required when config.auth.okta.enabled" }}
    {{- end }}

    [auth.okta]
    enabled = true
    issuer = {{ .Values.config.auth.okta.issuer | quote }}
    client_id = {{ .Values.config.auth.okta.clientId | quote }}
    client_secret = {{ .Values.secrets.oktaClientSecret | quote }}
    admin_groups = [{{- range $i, $g := .Values.config.auth.okta.adminGroups }}{{ if $i }}, {{ end }}{{ $g | quote }}{{- end }}]
    {{- end }}
    {{- with .Values.config.extraToml }}

    {{ . | nindent 4 }}
    {{- end }}
  {{- if and .Values.postgres.enabled (not .Values.database.url) }}
  db-password: {{ .Values.secrets.dbPassword | quote }}
  {{- end }}
{{- end -}}
